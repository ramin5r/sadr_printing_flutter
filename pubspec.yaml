name: sadr
description: Simple RTL Flutter app for Sadr Printing with sqflite database.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  path: ^1.9.1
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.5

flutter:
  uses-material-design: true
